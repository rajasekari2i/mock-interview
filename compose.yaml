services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mockinterview
      POSTGRES_USER: mockinterview
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - mockinterview_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockinterview -d mockinterview"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: python:3.12-slim
    working_dir: /workspace
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/workspace
    command: >-
      sh -c "pip install --requirement apps/api/requirements.lock &&
      pip install --no-deps --editable apps/api &&
      uvicorn app.main:build_app --factory --app-dir apps/api --host 0.0.0.0 --port 8000
      --reload --no-access-log"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    image: node:24-alpine
    working_dir: /workspace/apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - .:/workspace
      - mockinterview_node_modules:/workspace/apps/web/node_modules
    command: sh -c "npm ci --ignore-scripts && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mockinterview_postgres:
  mockinterview_node_modules:
