[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mockinterview-api"
version = "0.1.0"
description = "MockInterview authentication API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "authlib==1.6.3",
  "cryptography==45.0.7",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-pyyaml==6.0.12.20250822",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "contract: validates public interfaces",
  "staging: requires non-production external provider credentials",
]

[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unreachable = true
